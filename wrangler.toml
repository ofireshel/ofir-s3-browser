name = "lexiorbit"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[vars]
USE_OPENAI = "true"
# Optional: pin a specific model available in your catalog (free vision model)
VISION_MODEL_ID = "@cf/llava/llava-1.5-7b-hf"
PREFER_REST = "true"
MORAL_MODEL_ID = "gpt-5-mini"


# Bind Workers AI to Pages Functions
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "SCORES"
# Replace with your actual namespace id created above
id = "b71bae9ab1da4d6195abfa20ec0f239b"

[env.preview]
[[env.preview.kv_namespaces]]
binding = "SCORES"
# Use your preview namespace id (created with --preview)
id = "db328232980346abbb9af422da0240ea"

