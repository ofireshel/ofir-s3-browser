<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Palm Reader (Mobile)</title>
  <style>
    :root{ --ink:#0a0a0a; --paper:#fafafa; --c4:#00d08a; }
    html,body{ height:100%; margin:0; background:var(--paper); font-family:'Segoe UI', Arial, sans-serif; color:var(--ink); }
    .wrap{ min-height:100%; display:grid; grid-template-rows:auto 1fr auto; }
    header{ padding:14px; border-bottom:4px solid var(--ink); background:#fff; display:flex; justify-content:space-between; align-items:center; }
    header .title{ font-weight:900; letter-spacing:.02em; }
    main{ padding:16px; display:grid; gap:14px; }
    .card{ border:6px solid var(--ink); border-radius:14px; background:#fff; box-shadow:6px 6px 0 var(--ink); padding:14px; display:grid; gap:12px; }
    video, img{ width:100%; border-radius:12px; background:#000; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    button{ appearance:none; border:4px solid var(--ink); background:#fff; color:var(--ink); padding:10px 14px; border-radius:10px; font-weight:900; box-shadow:4px 4px 0 var(--ink); }
    button:disabled{ opacity:.5; }
    .results{ border:6px solid var(--ink); border-radius:14px; background:#f7fff9; padding:14px; }
    .pill{ display:inline-block; padding:6px 10px; border-radius:999px; border:2px solid var(--ink); background:#eafff4; margin:4px 6px 0 0; font-weight:700; }
    .err{ color:#b91c1c; font-weight:700; }
    @media(min-width:861px){ .desktop-note{ display:block } }
    @media(max-width:860px){ .desktop-note{ display:none } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Palm Reader</div>
      <a href="games.html" style="text-decoration:none; font-weight:900;">Back</a>
    </header>
    <main>
      <div class="card">
        <div class="desktop-note">This experience is designed for mobile devices.</div>
        <video id="vid" playsinline autoplay muted></video>
        <div class="row">
          <button id="btnStart">Enable Camera</button>
          <button id="btnShot" disabled>Capture Palm</button>
          <input id="file" type="file" accept="image/*" capture="environment" style="display:none">
        </div>
        <canvas id="canvas" style="display:none"></canvas>
        <img id="preview" alt="preview" style="display:none"/>
        <div id="status"></div>
      </div>
      <div id="results" class="results" style="display:none">
        <div style="font-weight:900; margin-bottom:8px">Your Reading</div>
        <div id="pos"></div>
        <div id="neg" style="margin-top:10px"></div>
      </div>
    </main>
    <footer></footer>
  </div>
  <script>
  (function(){
    const vid = document.getElementById('vid');
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    const btnStart = document.getElementById('btnStart');
    const btnShot = document.getElementById('btnShot');
    const file = document.getElementById('file');
    const statusEl = document.getElementById('status');
    const preview = document.getElementById('preview');
    const results = document.getElementById('results');
    const pos = document.getElementById('pos');
    const neg = document.getElementById('neg');
    

    let stream = null;

    function setStatus(msg, isErr){ statusEl.textContent = msg || ''; statusEl.className = isErr ? 'err' : ''; }

    function stopCam(){
      try{
        if(stream){ stream.getTracks().forEach(tr=>{ try{ tr.stop(); }catch{} }); }
      }catch{}
      stream = null;
      try{ vid.pause(); }catch{}
      vid.srcObject = null;
      vid.style.display = 'none';
      btnShot.disabled = true;
      btnStart.disabled = true;
    }

    async function startCam(){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio:false });
        vid.srcObject = stream; btnShot.disabled = false; setStatus('Camera ready');
      }catch(e){ setStatus('Camera error: ' + e.message, true); file.style.display = 'inline-block'; file.click(); }
    }

    function isSafari(){ const ua = navigator.userAgent; return /Safari\//.test(ua) && !/Chrome\//.test(ua); }

    function snapBlob(){
      const vw = vid.videoWidth, vh = vid.videoHeight;
      if(!vw || !vh){ throw new Error('Video not ready'); }
      // crop center square to focus palm
      const size = Math.min(vw, vh);
      const sx = (vw - size)/2, sy = (vh - size)/2;
      const outSize = 640;
      const quality = 0.75;
      cvs.width = outSize; cvs.height = outSize;
      ctx.drawImage(vid, sx, sy, size, size, 0, 0, outSize, outSize);
      return new Promise((res)=> cvs.toBlob(res, 'image/jpeg', quality));
    }

    async function analyze(blob){
      setStatus('Analyzing palm...');
      const fd = new FormData();
      fd.append('image', blob, 'palm.jpg');
      const resp = await fetch('/api/palm', { method:'POST', body: fd, headers:{ 'Accept':'application/json' } });
      const txt = await resp.text();
      if(!resp.ok){ throw new Error((txt||'Server error').slice(0,280)); }
      let data;
      try { data = JSON.parse(txt); }
      catch { throw new Error('Unexpected response: '+txt.slice(0,180)); }
      if (data.notPalm) {
        results.style.display = 'none';
        setStatus(`This is an image of ${data.notPalm.object}. Please take a clear picture of the palm of your hand for the analysis.`, true);
        return;
      }
      renderResult(data);
    }

    function renderResult(data){
      results.style.display = 'block';
      preview.style.display = 'block';
      preview.src = cvs.toDataURL('image/jpeg', 0.9);
      setStatus('');
      const posPool = [
        {text:'Decisive and goal-driven', reason:'strong head line'},
        {text:'Calm under pressure', reason:'deep life line'},
        {text:'Empathetic communicator', reason:'clear heart line'},
        {text:'Independent thinker', reason:'distinct fate line'},
        {text:'Focused and disciplined', reason:'balanced mounts'}
      ];
      const negPool = [
        {text:'Career gain within 3 months', reason:'fate line strengthens'},
        {text:'New partnership in 6 weeks', reason:'joining near heart line'},
        {text:'Smart financial move soon', reason:'clean restarts on lines'},
        {text:'Travel opportunity this season', reason:'long travel line'},
        {text:'A bold choice unlocks progress', reason:'bright Apollo line'}
      ];
      function normalize(arr, pool){
        const out = (arr||[]).map(it=> (typeof it==='string'? {text:it, reason:''} : {text:it.text||'', reason:it.reason||''})).filter(x=>x.text).slice(0,3);
        let i=0;
        while(out.length<3 && i<pool.length){ out.push(pool[i++]); }
        // ensure reasons
        for(let j=0;j<out.length;j++){ if(!out[j].reason){ out[j].reason = (pool[j%pool.length]||{}).reason || ''; } }
        return out.slice(0,3);
      }
      // New schema: positives/negatives with {trait, prediction, reason}
      const positives = Array.isArray(data.positives) ? data.positives : [];
      const negatives = Array.isArray(data.negatives) ? data.negatives : [];
      function renderSection(title, items, sign){
        const header = '<div style="font-weight:800;margin:8px 0">'+title+'</div>';
        const body = items.slice(0,3).map(it=>{
          const trait = (it.trait||'').trim();
          const pred  = (it.prediction||'').trim();
          const cue   = (it.reason||'').trim();
          const pill  = (trait && pred) ? (trait + ' — ' + pred) : (trait || pred);
          const below = cue; // observation shows visual cue only
          return '<div class="pill">'+sign+' '+escapeHtml(pill)+'</div>'+
                 '<div style="font-size:12px;opacity:.75;margin:-4px 0 6px 6px">Observation: '+escapeHtml(below)+'</div>';
        }).join('');
        return header + body;
      }
      pos.innerHTML = renderSection('Positive Traits & Predictions', positives, '+');
      neg.innerHTML = renderSection('Cautions: Traits & Predictions', negatives, '-');

    }

    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

    btnStart.onclick = startCam;
    function usedToday(limit){
      try{
        const MAX = typeof limit === 'number' && limit > 0 ? limit : 5;
        const today = new Date().toISOString().slice(0,10);
        const usageKey = 'palm_reader_usage';
        const legacyKey = 'palm_reader_last_play_utc';
        // migrate legacy 1-per-day flag to usage count=1
        const legacy = localStorage.getItem(legacyKey);
        if (legacy === today && !localStorage.getItem(usageKey)) {
          localStorage.setItem(usageKey, JSON.stringify({ date: today, count: 1 }));
          try { localStorage.removeItem(legacyKey); } catch {}
        }
        let usage = {};
        try { usage = JSON.parse(localStorage.getItem(usageKey) || '{}'); } catch { usage = {}; }
        if (usage.date !== today) { usage = { date: today, count: 0 }; }
        if ((usage.count || 0) >= MAX) return true;
        usage.count = (usage.count || 0) + 1;
        localStorage.setItem(usageKey, JSON.stringify(usage));
        return false;
      }catch{ return false; }
    }

    btnShot.onclick = async()=>{
      if (usedToday(5)) { setStatus('Daily limit reached. Please try again tomorrow.', true); return; }
      try{ const blob = await snapBlob(); stopCam(); await analyze(blob); }
      catch(e){ setStatus('Capture/Analyze error: '+e.message, true); }
    };
    file.onchange = async (e)=>{
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const img = new Image(); img.onload = async()=>{
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size)/2, sy = (img.height - size)/2;
        const outSize = 640;
        const quality = 0.75;
        cvs.width = outSize; cvs.height = outSize;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, outSize, outSize);
        const blob = await new Promise(r=>cvs.toBlob(r,'image/jpeg',quality));
        stopCam();
        analyze(blob);
      }; img.src = URL.createObjectURL(f);
    };
  })();
  </script>
</body>
</html>
